  <!-- Three white dots inside bubble -->
  <circle cx="16.76" cy="30.9" r="2.34" fill="white"/>
  <circle cx="24.25" cy="30.9" r="2.34" fill="white"/>
  <circle cx="31.73" cy="30.9" r="2.34" fill="white"/>
  <!-- chaties text – font loaded via page CSS -->
  <text x="48" y="37" font-family="Supreme, Arial, sans-serif" font-size="28" font-weight="500" fill="white" letter-spacing="-0.7">chaties</text>
