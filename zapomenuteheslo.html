    <div class="nav-separator"></div>

    <!-- ==================== DECORATIVE IMAGE ==================== -->
    <img class="auth-img" src="https://www.figma.com/api/mcp/asset/6e417e86-e6e3-4cad-a2ce-5d1e0920f29c" alt="" />

    <!-- ==================== FORGOT PASSWORD FORM ==================== -->
    <h1 class="auth-heading zap-heading">
      <span class="accent">Zapomněli jste<br>své heslo?</span>
    </h1>

    <p class="auth-subtext zap-subtext"><span style="color:#8b8b8b;">Pro obnovení hesla stačí vyplnit e-mail, na který<br>následně </span><strong>obdržíte odkaz pro vytvoření<br>nového hesla.</strong></p>

    <input class="auth-input zap-input-email" type="email" placeholder="E-mail" />

    <button id="zap-btn" class="auth-btn zap-btn">Odeslat odkaz pro obnovu hesla</button>
    <p id="zap-msg" style="display:none;position:absolute;left:1039px;top:755px;width:384px;padding:10px 14px;border-radius:8px;font-size:13px;font-family:Supreme,sans-serif;box-sizing:border-box;line-height:1.5;margin:0;"></p>

  </div><!-- /.page -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/chaties.js"></script>
  <script>
  (function () {
    var btn = document.getElementById('zap-btn');
    var msg = document.getElementById('zap-msg');

    function showErr(text) {
      msg.style.color = '#ff5555';
      msg.style.background = 'rgba(255,85,85,0.08)';
      msg.style.border = '1px solid rgba(255,85,85,0.35)';
      msg.innerHTML = '⚠&nbsp;' + text;
      msg.style.display = 'block';
    }

    function showOk(text) {
      msg.style.color = '#d0ee52';
      msg.style.background = 'rgba(208,238,82,0.08)';
      msg.style.border = '1px solid rgba(208,238,82,0.3)';
      msg.innerHTML = '✓&nbsp;' + text;
      msg.style.display = 'block';
    }

    btn.addEventListener('click', async function () {
      var email = document.querySelector('.zap-input-email').value.trim();
      msg.style.display = 'none';

      if (!email) { showErr('Zadejte váš e-mail.'); return; }

      btn.textContent = 'Odesílám…';
      btn.disabled = true;

      var { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://chaties.cz/nove-heslo.html'
      });

      if (error) {
        showErr('Nepodařilo se odeslat e-mail: ' + error.message);
        btn.textContent = 'Odeslat odkaz pro obnovu hesla';
        btn.disabled = false;
        return;
      }

      showOk('Odkaz byl odeslán. Zkontrolujte svůj e-mail.');
      btn.textContent = 'Odesláno';
    });
  })();
  </script>
</body>
</html>
